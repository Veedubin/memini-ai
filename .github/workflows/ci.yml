name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg18
        env: { POSTGRES_USER: memini, POSTGRES_PASSWORD: memini, POSTGRES_DB: memini_test }
        ports: ["5555:5432"]
        options: >-
          --health-cmd "pg_isready -U memini -d memini_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install 3.13
      - run: uv sync --extra dev
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest
        env:
          MEMINI_TEST_DB_URL: postgresql://memini:memini@localhost:5555/memini_test
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      # mkdocs only reads docs/, so build it without the project env and its torch download.
      - run: uvx --from mkdocs-material mkdocs build --strict
