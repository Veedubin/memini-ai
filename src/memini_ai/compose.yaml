services:
  memini-db:
    image: docker.io/pgvector/pgvector:pg18
    container_name: memini-db
    environment:
      POSTGRES_USER: memini
      POSTGRES_PASSWORD: memini
      POSTGRES_DB: memini
    ports:
      - "127.0.0.1:5555:5432"
    volumes:
      - memini-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memini -d memini"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  memini-db-data:
