[project]
name = "memini-ai"
version = "0.1.2"
description = "Local-first memory server for AI coding agents. Three MCP tools, pgvector + full-text search."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "VeeDubin" }]
keywords = ["mcp", "memory", "pgvector", "agents"]
dependencies = [
  "fastmcp>=3.0",
  "asyncpg>=0.30",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "structlog>=24.0",
]

[project.urls]
Homepage = "https://github.com/Veedubin/memini-ai"
Repository = "https://github.com/Veedubin/memini-ai"
Documentation = "https://github.com/Veedubin/memini-ai/tree/main/docs"
Changelog = "https://github.com/Veedubin/memini-ai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.10", "mkdocs<2", "mkdocs-material>=9.5"]

[project.scripts]
memini-ai = "memini_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memini_ai"]

[tool.uv]
# CPU torch by default; users with a GPU install their own torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "pgvector.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
